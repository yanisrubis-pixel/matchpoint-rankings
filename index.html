<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F0F4F8;}
.board{max-width:960px;margin:16px auto;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.10);}
.header{background:linear-gradient(135deg,#1F4E79 0%,#2E75B6 100%);padding:24px 28px 20px;color:white;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.header-eyebrow{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:5px;}
.header-title{font-size:26px;font-weight:800;}
.header-sub{font-size:12px;opacity:.75;margin-top:4px;}
.header-date{background:rgba(255,255,255,.15);border-radius:8px;padding:8px 14px;font-size:11px;text-align:right;flex-shrink:0;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#F7FAFF;border-bottom:1px solid #E4EAF0;}
.stat{padding:14px 16px;text-align:center;border-right:1px solid #E4EAF0;}
.stat:last-child{border-right:none;}
.stat-num{font-size:22px;font-weight:800;color:#1F4E79;}
.stat-label{font-size:10px;color:#999;margin-top:2px;}
/* Sort toggle */
.sort-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#F7FAFF;border-bottom:1px solid #E4EAF0;}
.sort-label{font-size:11px;color:#999;font-weight:600;}
.sort-btn{padding:6px 16px;border-radius:20px;border:2px solid #DDD;background:white;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;}
.sort-btn.active-s{border-color:#1F4E79;background:#1F4E79;color:white;}
.sort-btn.active-d{border-color:#1F4E79;background:#1F4E79;color:white;}
/* Top of month */
.top-month{padding:16px 20px;background:linear-gradient(135deg,#FFF8E7 0%,#FDEBD0 100%);border-bottom:2px solid #F39C12;}
.top-month-title{font-size:12px;font-weight:800;color:#7B3F00;letter-spacing:1px;margin-bottom:10px;}
.top-month-cards{display:flex;gap:10px;flex-wrap:wrap;}
.top-month-card{background:white;border-radius:10px;padding:10px 14px;flex:1;min-width:120px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;}
.tm-medal{font-size:22px;flex-shrink:0;}
.tm-name{font-size:13px;font-weight:700;color:#1A1A1A;}
.tm-gain{font-size:15px;font-weight:800;color:#1A6B3A;}
.tm-gain-label{font-size:10px;color:#999;}
/* Section & player rows */
.section-header{padding:8px 20px;font-size:11px;font-weight:700;letter-spacing:.5px;border-left:4px solid;}
.section-Elite{background:#D6E4F0;color:#1F4E79;border-color:#1F4E79;}
.section-Tournament{background:#D4EDDA;color:#1A6B3A;border-color:#1A6B3A;}
.section-Advanced{background:#FDEBD0;color:#7B3F00;border-color:#E67E22;}
.player-row{display:grid;grid-template-columns:44px 1fr 80px 120px 1fr;gap:6px 10px;align-items:center;padding:10px 20px;border-bottom:1px solid #F5F5F5;}
.player-row.top3{background:#F7FAFF;}
.rank-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.rank-badge.top{background:#1F4E79;color:white;font-size:16px;}
.rank-badge.normal{background:#EBEBEB;color:#666;}
.player-info{min-width:0;}
.player-name{font-weight:600;font-size:14px;color:#1A1A1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-age{font-size:11px;color:#AAA;margin-top:1px;}
.mobile-badge{display:none;}
.level-col{display:flex;align-items:center;padding-left:4px;}
.level-badge{display:inline-block;padding:3px 8px;border-radius:20px;font-weight:600;font-size:10px;white-space:nowrap;}
.badge-Elite{background:#D6E4F0;color:#1F4E79;}
.badge-Tournament{background:#D4EDDA;color:#1A6B3A;}
.badge-Advanced{background:#FDEBD0;color:#7B3F00;}
/* Dual UTR display */
.utr-dual{display:flex;flex-direction:column;gap:4px;}
.utr-row{display:flex;align-items:center;gap:5px;}
.utr-icon{font-size:12px;width:16px;text-align:center;flex-shrink:0;}
.utr-val{font-size:18px;font-weight:800;color:#1F4E79;}
.utr-val.zero{font-size:12px;color:#CCC;font-weight:400;}
.utr-val-d{font-size:18px;font-weight:800;color:#1F4E79;}
.utr-val-d.zero{font-size:12px;color:#CCC;font-weight:400;}
.utr-change{font-size:10px;font-weight:700;}
.utr-change.up{color:#1A6B3A;}
.utr-change.down{color:#E74C3C;}
/* Dual bars */
.bar-dual{display:flex;flex-direction:column;gap:5px;min-width:0;}
.bar-bg{flex:1;height:6px;background:#E8E8E8;border-radius:3px;overflow:hidden;}
.bar-fill-s{height:100%;background:linear-gradient(90deg,#2E75B6,#1F4E79);border-radius:3px;}
.bar-fill-d{height:100%;background:linear-gradient(90deg,#2E75B6,#1F4E79);border-radius:3px;}
.footer{padding:10px 20px;font-size:10px;color:#BBB;border-top:1px solid #F0F0F0;text-align:center;}
.print-btn{position:fixed;bottom:20px;right:20px;background:#1F4E79;color:white;border:none;border-radius:8px;padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:999;}
.share-btn{position:fixed;bottom:20px;left:20px;background:#25D366;color:white;border:none;border-radius:8px;padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:999;}
.copied-toast{position:fixed;bottom:70px;left:20px;background:#333;color:white;padding:8px 14px;border-radius:6px;font-size:12px;display:none;z-index:999;}
@media(max-width:520px){
  .board{margin:8px;border-radius:8px;}.header{padding:14px;}.header-title{font-size:18px;}.header-date{display:none;}
  .stat{padding:10px 4px;}.stat-num{font-size:17px;}.stat-label{font-size:8px;}
  .player-row{grid-template-columns:28px 1fr 58px 90px 40px;gap:4px;padding:7px 8px;}
  .player-row .level-col{display:flex;align-items:center;padding-left:0;justify-self:start;margin-left:-22px;}
  .level-badge{font-size:8px;padding:2px 5px;}
  .mobile-badge{display:none;}
  .rank-badge{width:26px;height:26px;font-size:10px;}.rank-badge.top{font-size:12px;}
  .player-name{font-size:12px;}.player-age{font-size:9px;}
  .utr-dual{overflow:hidden;}
  .utr-row{flex-wrap:nowrap;overflow:hidden;}
  .utr-val,.utr-val-d{font-size:12px;}.utr-icon{width:12px;}.utr-change{font-size:9px;white-space:nowrap;}
  .bar-dual{gap:2px;min-width:0;}.bar-bg{height:4px;}
  .print-btn,.share-btn{padding:9px 14px;font-size:12px;}
  .top-month-card{min-width:90px;padding:8px 10px;}.tm-name{font-size:11px;}.tm-gain{font-size:13px;}
}
@media print{.print-btn,.share-btn{display:none;}body{background:white;}.board{box-shadow:none;margin:0;border-radius:0;max-width:100%;}}
.expand-row{overflow:hidden;max-height:0;transition:max-height .25s ease;background:#EEF4FB;border-bottom:1px solid #E4EAF0;}
.expand-row.open{max-height:120px;}
.expand-inner{padding:10px 20px 10px 74px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.expand-item{display:flex;flex-direction:column;gap:2px;}
.expand-label{font-size:9px;color:#999;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.expand-val{font-size:15px;font-weight:800;color:#1F4E79;}
.expand-gain{font-size:13px;font-weight:700;}
.expand-gain.up{color:#1A6B3A;}
.expand-gain.down{color:#E74C3C;}
.player-name-btn{cursor:pointer;user-select:none;}
.player-name-btn:hover{color:#1F4E79;}
</style>
</head>
<body>
<div class="board" id="board"></div>
<button class="print-btn" onclick="window.print()">🖨️ Print</button>
<button class="share-btn" onclick="shareLink()">🔗 Share</button>
<div class="copied-toast" id="copiedToast">✅ Link copied!</div>
<script>
const MEDALS=["🥇","🥈","🥉"];
const LEVEL_ORDER=["Elite","Tournament","Advanced"];
let sortMode='singles'; // 'singles' or 'doubles'

function getYearKey(){return String(new Date().getFullYear());}
function getYearName(){return String(new Date().getFullYear());}
function getMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function getMonthName(){return new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});}
const MONTH_DATA=(()=>{try{return JSON.parse(document.getElementById('month-data').textContent);}catch(e){return {};}})();

let _openExpandId=null;
function toggleExpand(id){
  if(_openExpandId!==null&&_openExpandId!==id){
    const prev=document.getElementById('expand-'+_openExpandId);
    if(prev)prev.classList.remove('open');
  }
  const el=document.getElementById('expand-'+id);
  if(!el)return;
  const isOpen=el.classList.contains('open');
  el.classList.toggle('open',!isOpen);
  _openExpandId=isOpen?null:id;
}

function setSortMode(mode){
  sortMode=mode;
  document.getElementById('btn-s').className='sort-btn'+(mode==='singles'?' active-s':'');
  document.getElementById('btn-d').className='sort-btn'+(mode==='doubles'?' active-d':'');
  renderTable(window._players);
}

function render(players){
  window._players=players;
  const rated=players.filter(p=>p.utr>0);
  const ratedD=players.filter(p=>p.utrd>0);
  const avg=rated.length?(rated.reduce((s,p)=>s+p.utr,0)/rated.length).toFixed(2):"—";
  const top=rated.length?Math.max(...rated.map(p=>p.utr)).toFixed(2):"—";
  const elite=players.filter(p=>p.level==="Elite").length;

  let html=`<div class="header"><div><div class="header-eyebrow">MATCHPOINT TENNIS CLUB — BAY PARKWAY, BROOKLYN</div><div class="header-title">Junior Player Rankings</div><div class="header-sub">Universal Tennis Rating (UTR) · Season 2026–2027</div></div><div class="header-date">Updated:<br>${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div></div>`;
  html+=`<div class="stats"><div class="stat"><div class="stat-num">${players.length}</div><div class="stat-label">Total Players</div></div><div class="stat"><div class="stat-num">${avg}</div><div class="stat-label">Avg Singles</div></div><div class="stat"><div class="stat-num">${top}</div><div class="stat-label">Highest UTR</div></div><div class="stat"><div class="stat-num">${elite}</div><div class="stat-label">Elite Group</div></div></div>`;
  html+=`<div class="sort-bar"><span class="sort-label">Sort by:</span><button id="btn-s" class="sort-btn active-s" onclick="setSortMode('singles')"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg> Singles</button><button id="btn-d" class="sort-btn" onclick="setSortMode('doubles')"><svg width="16" height="14" viewBox="0 0 32 24" fill="currentColor"><path d="M8 12c2.2 0 4-1.8 4-4S10.2 4 8 4 4 5.8 4 8s1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm16-2c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg> Doubles</button></div>`;

  // Top gainers за МЕСЯЦ
  const mk=getMonthKey();
  const monthBases=MONTH_DATA[mk]||{};
  const gainers=players.filter(p=>p.utr>0&&monthBases[String(p.id)]>0&&(p.utr-monthBases[String(p.id)])>0.005)
    .map(p=>({...p,gain:parseFloat((p.utr-monthBases[String(p.id)]).toFixed(2))}))
    .sort((a,b)=>b.gain-a.gain).slice(0,3);
  if(gainers.length>0){
    html+=`<div class="top-month"><div class="top-month-title">🏆 TOP GAINERS — ${getMonthName()}</div><div class="top-month-cards">`;
    gainers.forEach((p,i)=>{
      html+=`<div class="top-month-card"><div class="tm-medal">${MEDALS[i]}</div><div><div class="tm-name">${p.name}</div><div class="tm-gain">+${p.gain.toFixed(2)} UTR</div></div></div>`;
    });
    html+=`</div></div>`;
  }

  html+=`<div id="table-body"></div><div class="footer">Matchpoint Tennis Club · Season 2026–2027</div>`;
  document.getElementById('board').innerHTML=html;
  renderTable(players);
}

function renderTable(players){
  const mode=sortMode;
  const mk=getMonthKey();
  const monthBases=MONTH_DATA[mk]||{};
  const sorted=[...players].sort((a,b)=>{
    const av=mode==='singles'?a.utr:a.utrd;
    const bv=mode==='singles'?b.utr:b.utrd;
    return bv-av;
  });
  let html=''; let rank=0;
  sorted.forEach(p=>{
    rank++;
    const level=p.level||'Advanced';
    const isTop=rank<=3;
    const badge=isTop?MEDALS[rank-1]:rank;
    const pctS=p.utr>0?Math.min((p.utr/10)*100,100).toFixed(1):0;
    const pctD=p.utrd>0?Math.min((p.utrd/10)*100,100).toFixed(1):0;
    let utrChange='';
    if(p.yearBase>0&&p.utr>0&&Math.abs(p.utr-p.yearBase)>=0.005){
      const diff=parseFloat((p.utr-p.yearBase).toFixed(2));
      utrChange=diff>0?`<span class="utr-change up">▲+${diff.toFixed(2)}</span>`:`<span class="utr-change down">▼${diff.toFixed(2)}</span>`;
    }
    let utrChangeD='';
    if(p.yearBaseD>0&&p.utrd>0&&Math.abs(p.utrd-p.yearBaseD)>=0.005){
      const diffD=parseFloat((p.utrd-p.yearBaseD).toFixed(2));
      utrChangeD=diffD>0?`<span class="utr-change up">▲+${diffD.toFixed(2)}</span>`:`<span class="utr-change down">▼${diffD.toFixed(2)}</span>`;
    }
    const rc=p.rankChange;
    const rankChangeHtml=rc&&rc!==0?(rc>0?`<span style="font-size:9px;color:#1A6B3A;font-weight:700;display:block;">↑${rc}</span>`:`<span style="font-size:9px;color:#E74C3C;font-weight:700;display:block;">↓${Math.abs(rc)}</span>`):'';
    // Expand row data
    const mBase=monthBases[String(p.id)]||0;
    const yBase=p.yearBase||0;
    const seasonDiff=yBase>0&&p.utr>0?parseFloat((p.utr-yBase).toFixed(2)):null;
    const monthDiff=mBase>0&&p.utr>0?parseFloat((p.utr-mBase).toFixed(2)):null;
    const seasonGainHtml=seasonDiff!==null?(seasonDiff>=0?`<span class="expand-gain up">▲ +${seasonDiff.toFixed(2)} season</span>`:`<span class="expand-gain down">▼ ${seasonDiff.toFixed(2)} season</span>`):'';
    const monthGainHtml=monthDiff!==null?(monthDiff>=0?`<span class="expand-gain up">▲ +${monthDiff.toFixed(2)} this month</span>`:`<span class="expand-gain down">▼ ${monthDiff.toFixed(2)} this month</span>`):'';
    const hasExpand=p.utr>0&&(yBase>0||mBase>0);
    html+=`<div class="player-row ${isTop?'top3':''}">
      <div class="rank-badge ${isTop?'top':'normal'}" style="flex-direction:column;gap:0;">${badge}${rankChangeHtml}</div>
      <div class="player-info">
        <div class="player-name${hasExpand?' player-name-btn':''}" ${hasExpand?'onclick="toggleExpand('+p.id+')"':''}>${p.name}${hasExpand?' <span style="font-size:10px;color:#AAA;">▾</span>':''}</div>
        <div class="player-age">Age ${p.age}</div>
        <div class="mobile-badge"><span class="level-badge badge-${level}">${level}</span></div>
      </div>
      <div class="level-col"><span class="level-badge badge-${level}">${level}</span></div>
      <div class="utr-dual">
        <div class="utr-row"><span class="utr-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="#1F4E79"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></span><span class="utr-val ${p.utr>0?'':'zero'}">${p.utr>0?p.utr.toFixed(2):'—'}</span>${utrChange}</div>
        <div class="utr-row"><span class="utr-icon"><svg width="16" height="13" viewBox="0 0 32 24" fill="#1F4E79"><path d="M8 12c2.2 0 4-1.8 4-4S10.2 4 8 4 4 5.8 4 8s1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm16-2c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg></span><span class="utr-val-d ${p.utrd>0?'':'zero'}">${p.utrd>0?p.utrd.toFixed(2):'—'}</span>${utrChangeD}</div>
      </div>
      <div class="bar-dual">
        <div class="bar-bg"><div class="bar-fill-s" style="width:${pctS}%"></div></div>
        <div class="bar-bg"><div class="bar-fill-d" style="width:${pctD}%"></div></div>
      </div>
    </div>${hasExpand?`<div class="expand-row" id="expand-${p.id}"><div class="expand-inner">
      ${yBase>0?`<div class="expand-item"><div class="expand-label">Season start Sep 21</div><div class="expand-val">${yBase.toFixed(2)}</div></div>`:''}
      ${mBase>0?`<div class="expand-item"><div class="expand-label">Month start</div><div class="expand-val">${mBase.toFixed(2)}</div></div>`:''}
      <div class="expand-item"><div class="expand-label">Current</div><div class="expand-val">${p.utr.toFixed(2)}</div></div>
      ${seasonGainHtml?`<div class="expand-item">${seasonGainHtml}</div>`:''}
      ${monthGainHtml?`<div class="expand-item">${monthGainHtml}</div>`:''}
    </div></div>`:''}
    `;
  });
  document.getElementById('table-body').innerHTML=html;
}

const data=JSON.parse(document.getElementById('player-data').textContent);
render(data);
function shareLink(){const url='https://matchpoint-rankings-production.up.railway.app';if(navigator.share){navigator.share({title:'Matchpoint Junior Rankings',url:url});}else{navigator.clipboard.writeText(url).then(()=>{const t=document.getElementById('copiedToast');t.style.display='block';setTimeout(()=>t.style.display='none',2000);});}}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}
</script>
</body>
</html>
