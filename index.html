  .utr-change.up{color:#1A6B3A;}
  .utr-change.down{color:#E74C3C;}
  .rank-change{font-size:10px;font-weight:700;margin-top:1px;}
  .rank-change.up{color:#1A6B3A;}
  .rank-change.down{color:#E74C3C;}
  .bar-wrap{display:flex;align-items:center;gap:8px;min-width:0;}

<body>
<div class="board" id="board"></div>
<button class="print-btn" onclick="window.print()">🖨️ Print</button>
<button class="share-btn" onclick="shareLink()">🔗 Share</button>
<div class="copied-toast" id="copiedToast">✅ Link copied!</div>
<script>
const MEDALS=["🥇","🥈","🥉"];
const LEVEL_ORDER=["Elite","Tournament","Advanced"];

function render(players) {
  const sorted=[...players].sort((a,b)=>b.utr-a.utr);
  const rated=players.filter(p=>p.utr>0);
  const avg=rated.length?(rated.reduce((s,p)=>s+p.utr,0)/rated.length).toFixed(2):"—";
  const top=rated.length?Math.max(...rated.map(p=>p.utr)).toFixed(2):"—";
  const elite=players.filter(p=>p.level==="Elite").length;

  let html=`<div class="header">
    <div>
      <div class="header-eyebrow">MATCHPOINT TENNIS CLUB — BAY PARKWAY, BROOKLYN</div>
      <div class="header-title">Junior Player Rankings</div>
      <div class="header-sub">Universal Tennis Rating (UTR) · Season 2026–2027</div>
    </div>
    <div class="header-date">Updated:<br>${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num">${players.length}</div><div class="stat-label">Total Players</div></div>
    <div class="stat"><div class="stat-num">${avg}</div><div class="stat-label">Avg UTR</div></div>
    <div class="stat"><div class="stat-num">${top}</div><div class="stat-label">Highest UTR</div></div>
    <div class="stat"><div class="stat-num">${elite}</div><div class="stat-label">Elite Group</div></div>
  </div>`;

  let rank=0;
  LEVEL_ORDER.forEach(level=>{
    const group=sorted.filter(p=>p.level===level);
    if(!group.length)return;
    html+=`<div class="section-header section-${level}">${level.toUpperCase()} GROUP — ${group.length} players</div>`;
    group.forEach(p=>{
      rank++;
      const isTop=rank<=3;
      const badge=isTop?MEDALS[rank-1]:rank;
      const pct=p.utr>0?Math.min((p.utr/10)*100,100).toFixed(1):0;

      // UTR change arrow
      let utrChange='';
      if(p.prevUtr&&p.prevUtr>0&&p.utr>0&&Math.abs(p.utr-p.prevUtr)>0.01){
        const diff=(p.utr-p.prevUtr).toFixed(2);
        utrChange=diff>0?`<div class="utr-change up">▲ UTR +${diff}</div>`:`<div class="utr-change down">▼ UTR ${diff}</div>`;
      }

      // Rank change arrow
      let rankChange='';
      if(p.prevRank&&p.prevRank!==rank){
        const diff=p.prevRank-rank;
        rankChange=diff>0?`<div class="rank-change up">▲ +${diff} position</div>`:`<div class="rank-change down">▼ ${Math.abs(diff)} position</div>`;
      }

      const utrHtml=p.utr>0
        ?`<div class="utr-cell"><div class="utr-value">${p.utr.toFixed(2)}</div>${utrChange}${rankChange}</div>`
        :`<div class="utr-cell"><div class="utr-value zero">—</div></div>`;

      html+=`<div class="player-row ${isTop?'top3':''}"><div class="rank-badge ${isTop?'top':'normal'}">${badge}</div><div class="player-info"><div class="player-name">${p.name}</div><div class="player-age">Age ${p.age}</div></div><div class="badge-col"><span class="level-badge badge-${level}">${level}</span></div>${utrHtml}<div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div></div>`;
    });
  });

  html+=`<div class="footer">Matchpoint Tennis Club · Season 2026–2027</div>`;
  document.getElementById('board').innerHTML=html;
}

const data=JSON.parse(document.getElementById('player-data').textContent);
render(data);

function shareLink(){
  const url='https://matchpoint-rankings-production.up.railway.app';
  if(navigator.share){navigator.share({title:'Matchpoint Junior Rankings',url:url});}
  else{navigator.clipboard.writeText(url).then(()=>{const t=document.getElementById('copiedToast');t.style.display='block';setTimeout(()=>t.style.display='none',2000);});}
}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}
</script>
</body>
</html>
