<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F0F4F8; }
  .topbar { background: #1A6B3A; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h2 { font-size: 14px; font-weight: 700; }
  .topbar span { font-size: 11px; opacity: 0.8; }

  .header-title { font-size: 26px; font-weight: 800; }
  .header-sub { font-size: 12px; opacity: 0.75; margin-top: 4px; }
  .header-date { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 14px; font-size: 11px; text-align: right; flex-shrink: 0; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); background: #F7FAFF; border-bottom: 1px solid #E4EAF0; }
  .stat { padding: 14px 16px; text-align: center; border-right: 1px solid #E4EAF0; }
  .stat:last-child { border-right: none; }
  .stat-num { font-size: 22px; font-weight: 800; color: #1F4E79; }
  .stat-label { font-size: 10px; color: #999; margin-top: 2px; }
  .section-header { padding: 8px 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; border-left: 4px solid; }
  .section-Elite       { background: #D6E4F0; color: #1F4E79; border-color: #1F4E79; }
  .section-Tournament  { background: #D4EDDA; color: #1A6B3A; border-color: #1A6B3A; }
  .section-Advanced    { background: #FDEBD0; color: #7B3F00; border-color: #E67E22; }
  /* Editor player row — wider to fit singles+doubles */
  .player-row { display: grid; grid-template-columns: 44px 1fr 110px 1fr 70px; gap: 10px; align-items: center; padding: 10px 20px; border-bottom: 1px solid #F5F5F5; }
  .player-row:hover { background: #F5F8FF; }
  .player-row.top3 { background: #F7FAFF; }
  .rank-badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .rank-badge.top    { background: #1F4E79; color: white; font-size: 16px; }
  .rank-badge.normal { background: #EBEBEB; color: #666; }
  .player-info { min-width: 0; }
  .player-name { font-weight: 600; font-size: 14px; color: #1A1A1A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-age  { font-size: 11px; color: #AAA; margin-top: 1px; }
  .level-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-weight: 600; font-size: 10px; }
  .badge-Elite       { background: #D6E4F0; color: #1F4E79; }
  .badge-Tournament  { background: #D4EDDA; color: #1A6B3A; }
  .badge-Advanced    { background: #FDEBD0; color: #7B3F00; }
  /* Dual UTR block for editor */

  .utr-row { display: flex; align-items: center; gap: 6px; }
  .utr-icon { font-size: 13px; flex-shrink: 0; width: 18px; text-align: center; }
  .utr-val { font-size: 15px; font-weight: 800; color: #1F4E79; min-width: 38px; }

  .utr-change.down { color: #E74C3C; }
  .bar-dual { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .bar-row { display: flex; align-items: center; gap: 5px; }
  .bar-lbl { font-size: 10px; color: #AAA; width: 14px; flex-shrink: 0; }
  .bar-bg   { flex: 1; height: 6px; background: #E8E8E8; border-radius: 3px; overflow: hidden; }
  .bar-fill-s { height: 100%; background: linear-gradient(90deg,#2E75B6,#1F4E79); border-radius: 3px; }
  .bar-fill-d { height: 100%; background: linear-gradient(90deg,#2E75B6,#1F4E79); border-radius: 3px; }
  .action-btns { display: flex; gap: 4px; }
  .btn-edit { background: #E8F0FE; border: none; cursor: pointer; color: #1F4E79; font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: 700; }
  .btn-del  { background: none; border: none; cursor: pointer; color: #DDD; font-size: 15px; padding: 4px 6px; border-radius: 4px; }
  .btn-del:hover { color: #E74C3C; background: #FEE; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }

  .modal-btns { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .btn-save   { padding: 8px 20px; background: #1F4E79; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
  .btn-cancel { padding: 8px 14px; background: #F0F0F0; color: #555; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .add-form { padding: 14px 20px; background: #FAFAFA; border-top: 1px solid #E8E8E8; }

function loadPlayers() {
  try {
    const s = localStorage.getItem('mp_editor');
    if (s) { const p = JSON.parse(s); if (p && p.length > 0) return p.map(x=>({utrd:0,...x})); }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
}
function savePlayers(p) { try { localStorage.setItem('mp_editor', JSON.stringify(p)); } catch(e) {} }

let players = loadPlayers();

function getMonthKey() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function loadMonthlyBase() { try { return JSON.parse(localStorage.getItem('mp_monthly')||'{}'); } catch(e) { return {}; } }
function saveMonthlyBase(mb) { try { localStorage.setItem('mp_monthly', JSON.stringify(mb)); } catch(e) {} }
function initMonthlyBase() {
  const mk=getMonthKey(); let mb=loadMonthlyBase();
  const keys=Object.keys(mb).sort(); while(keys.length>2){delete mb[keys.shift()];}
  if(!mb[mk]){ mb[mk]={}; players.forEach(p=>{if(p.utr>0)mb[mk][p.id]=p.utr;}); saveMonthlyBase(mb); }
  return mb;
}

function today() { return new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }
function showToast(msg, color="#1A6B3A") {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.background=color;
  t.style.display='block'; setTimeout(()=>t.style.display='none',2500);
}

    const group=sorted.filter(p=>p.level===level);
    if(!group.length) return;
    html+=`<div class="section-header section-${level}">${level.toUpperCase()} GROUP — ${group.length} players</div>`;
    group.forEach(p=>{
      rank++;
      const isTop=rank<=3;
      const badge=isTop?MEDALS[rank-1]:rank;
      const pctS=p.utr>0?Math.min((p.utr/10)*100,100).toFixed(1):0;
      const pctD=p.utrd>0?Math.min((p.utrd/10)*100,100).toFixed(1):0;
      let changeHtml='';
      if(p.prevUtr&&p.prevUtr>0&&p.utr>0&&Math.abs(p.utr-p.prevUtr)>0.01){
        const diff=(p.utr-p.prevUtr).toFixed(2);
        changeHtml=diff>0?`<span class="utr-change up">▲+${diff}</span>`:`<span class="utr-change down">▼${diff}</span>`;
      }
      html+=`
      <div class="player-row ${isTop?'top3':''}">
        <div class="rank-badge ${isTop?'top':'normal'}">${badge}</div>
        <div class="player-info">
          <div class="player-name">${p.utrId?`<a href="https://app.utrsports.net/profiles/${p.utrId}" target="_blank" style="color:#1A1A1A;text-decoration:none;border-bottom:1px dotted #AAA;">${p.name} ↗</a>`:p.name}</div>
          <div class="player-age">Age ${p.age}${p.utrId?' · ID: '+p.utrId:' · no ID'}</div>
          <div style="margin-top:3px"><span class="level-badge badge-${level}">${level}</span></div>
        </div>
        <div class="utr-dual">
          <div class="utr-row">
            <span class="utr-icon">👤</span>
            <span class="utr-val ${p.utr>0?'':'zero'}">${p.utr>0?p.utr.toFixed(2):'—'}</span>
            ${changeHtml}
          </div>
          <div class="utr-row">
            <span class="utr-icon">👥</span>
            <span class="utr-val ${p.utrd>0?'':'zero'}">${p.utrd>0?p.utrd.toFixed(2):'—'}</span>
          </div>
        </div>
        <div class="bar-dual">
          <div class="bar-row"><div class="bar-bg"><div class="bar-fill-s" style="width:${pctS}%"></div></div></div>
          <div class="bar-row"><div class="bar-bg"><div class="bar-fill-d" style="width:${pctD}%"></div></div></div>
        </div>
        <div class="action-btns">
          <button class="btn-edit" onclick="openEdit(${p.id})">Edit</button>
          <button class="btn-del"  onclick="delPlayer(${p.id})">✕</button>
        </div>
      </div>`;
    });
  });

  html+=`
  <div class="add-form">
    <label>ADD PLAYER</label>
    <div class="fields">
      <input id="f-name" placeholder="Full Name" style="width:150px">
      <input id="f-age"  placeholder="Age" type="number" style="width:50px">
      <input id="f-utr"  placeholder="👤 Singles" type="number" step="0.01" style="width:95px">
      <input id="f-utrd" placeholder="👥 Doubles" type="number" step="0.01" style="width:95px">
      <input id="f-utrid" placeholder="UTR ID" style="width:90px">
      <select id="f-level" style="width:120px"><option>Elite</option><option>Tournament</option><option>Advanced</option></select>
      <button class="btn-add" onclick="addPlayer()">+ Add</button>
    </div>
  </div>
  <div class="footer">Matchpoint Tennis Club · Season 2026–2027</div>`;

  document.getElementById('board').innerHTML=html;
}

function addPlayer() {
  const name=document.getElementById('f-name').value.trim();
  const age=parseInt(document.getElementById('f-age').value)||10;
  const utr=parseFloat(document.getElementById('f-utr').value)||0;
  const utrd=parseFloat(document.getElementById('f-utrd').value)||0;
  const utrId=document.getElementById('f-utrid').value.trim();
  const level=document.getElementById('f-level').value;
  if(!name){alert('Enter name');return;}
  const maxId=players.length?Math.max(...players.map(p=>p.id)):0;
  players.push({id:maxId+1,name,age,utr,utrd,level,utrId,prevUtr:0});
  savePlayers(players); render(); showToast('Added: '+name);
}

function delPlayer(id) {
  const p=players.find(x=>x.id===id);
  if(!p||!confirm('Remove '+p.name+'?'))return;
  players=players.filter(x=>x.id!==id);
  savePlayers(players); render(); showToast('Removed','#E74C3C');
}

function openEdit(id) {
  const p=players.find(x=>x.id===id); if(!p)return;
  document.getElementById('edit-id').value=p.id;
  document.getElementById('edit-name').value=p.name;
  document.getElementById('edit-age').value=p.age;
  document.getElementById('edit-utr').value=p.utr||'';
  document.getElementById('edit-utrd').value=p.utrd||'';
  document.getElementById('edit-utrid').value=p.utrId||'';
  document.getElementById('edit-level').value=p.level;
  document.getElementById('editModal').classList.add('open');
}
function closeModal(){document.getElementById('editModal').classList.remove('open');}
function saveEdit() {
  const id=parseInt(document.getElementById('edit-id').value);
  const name=document.getElementById('edit-name').value.trim();
  const age=parseInt(document.getElementById('edit-age').value)||10;
  const newUtr=parseFloat(document.getElementById('edit-utr').value)||0;
  const newUtrd=parseFloat(document.getElementById('edit-utrd').value)||0;
  const utrId=document.getElementById('edit-utrid').value.trim();
  const level=document.getElementById('edit-level').value;
  if(!name)return;
  players=players.map(p=>{
    if(p.id!==id)return p;
    const prevUtr=(p.utr&&p.utr!==newUtr)?p.utr:(p.prevUtr||0);
    return{...p,name,age,utr:newUtr,utrd:newUtrd,utrId,level,prevUtr};
  });
  savePlayers(players); closeModal(); render(); showToast('Saved!');
}
document.addEventListener('click',e=>{if(e.target.id==='editModal')closeModal();});

  savePlayers(players);
  const mk=getMonthKey(); let mb=loadMonthlyBase();
  if(!mb[mk]){mb[mk]={};players.forEach(p=>{if(p.utr>0)mb[mk][p.id]=p.utr;});saveMonthlyBase(mb);}
  const monthBase=mb[mk]||{};
  const playersWithMonthly=players.map(p=>({...p,monthBase:monthBase[p.id]||0,monthKey:mk}));
  const playerData=JSON.stringify(playersWithMonthly);

<script>
const MEDALS=["🥇","🥈","🥉"];
const LEVEL_ORDER=["Elite","Tournament","Advanced"];
let sortMode='singles'; // 'singles' or 'doubles'

function getMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function getMonthName(){return new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"});}

function setSortMode(mode){
  sortMode=mode;
  document.getElementById('btn-s').className='sort-btn'+(mode==='singles'?' active-s':'');
  document.getElementById('btn-d').className='sort-btn'+(mode==='doubles'?' active-d':'');
  renderTable(window._players);
}

function render(players){
  window._players=players;
  const currentMk=getMonthKey();
  const rated=players.filter(p=>p.utr>0);
  const ratedD=players.filter(p=>p.utrd>0);
  const avg=rated.length?(rated.reduce((s,p)=>s+p.utr,0)/rated.length).toFixed(2):"—";
  const top=rated.length?Math.max(...rated.map(p=>p.utr)).toFixed(2):"—";
  const elite=players.filter(p=>p.level==="Elite").length;

  let html=\`<div class="header"><div><div class="header-eyebrow">MATCHPOINT TENNIS CLUB — BAY PARKWAY, BROOKLYN</div><div class="header-title">Junior Player Rankings</div><div class="header-sub">Universal Tennis Rating (UTR) · Season 2026–2027</div></div><div class="header-date">Updated:<br>\${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div></div>\`;
  html+=\`<div class="stats"><div class="stat"><div class="stat-num">\${players.length}</div><div class="stat-label">Total Players</div></div><div class="stat"><div class="stat-num">\${avg}</div><div class="stat-label">Avg Singles</div></div><div class="stat"><div class="stat-num">\${top}</div><div class="stat-label">Highest UTR</div></div><div class="stat"><div class="stat-num">\${elite}</div><div class="stat-label">Elite Group</div></div></div>\`;
  html+=\`<div class="sort-bar"><span class="sort-label">Sort by:</span><button id="btn-s" class="sort-btn active-s" onclick="setSortMode('singles')"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg> Singles</button><button id="btn-d" class="sort-btn" onclick="setSortMode('doubles')"><svg width="16" height="14" viewBox="0 0 32 24" fill="currentColor"><path d="M8 12c2.2 0 4-1.8 4-4S10.2 4 8 4 4 5.8 4 8s1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm16-2c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg> Doubles</button></div>\`;

  // Top of month gainers
  const gainers=players.filter(p=>p.utr>0&&p.monthBase>0&&p.monthKey===currentMk&&(p.utr-p.monthBase)>0.01)
    .map(p=>({...p,gain:parseFloat((p.utr-p.monthBase).toFixed(2))}))
    .sort((a,b)=>b.gain-a.gain).slice(0,3);
  if(gainers.length>0){
    html+=\`<div class="top-month"><div class="top-month-title">🏆 TOP GAINERS — \${getMonthName()}</div><div class="top-month-cards">\`;
    gainers.forEach((p,i)=>{html+=\`<div class="top-month-card"><div class="tm-medal">\${MEDALS[i]}</div><div><div class="tm-name">\${p.name}</div><div class="tm-gain">+\${p.gain.toFixed(2)}</div><div class="tm-gain-label">Singles UTR this month</div></div></div>\`;});
    html+=\`</div></div>\`;
  }

  html+=\`<div id="table-body"></div><div class="footer">Matchpoint Tennis Club · Season 2026–2027</div>\`;
  document.getElementById('board').innerHTML=html;
  renderTable(players);
}

function renderTable(players){
  const mode=sortMode;
  const sorted=[...players].sort((a,b)=>{
    const av=mode==='singles'?a.utr:a.utrd;
    const bv=mode==='singles'?b.utr:b.utrd;
    return bv-av;
  });
  let html=''; let rank=0;
  LEVEL_ORDER.forEach(level=>{
    const group=sorted.filter(p=>p.level===level);
    if(!group.length)return;
    html+=\`<div class="section-header section-\${level}">\${level.toUpperCase()} GROUP — \${group.length} players</div>\`;
    group.forEach(p=>{
      rank++;
      const isTop=rank<=3;
      const badge=isTop?MEDALS[rank-1]:rank;
      const pctS=p.utr>0?Math.min((p.utr/10)*100,100).toFixed(1):0;
      const pctD=p.utrd>0?Math.min((p.utrd/10)*100,100).toFixed(1):0;
      let utrChange='';
      if(p.prevUtr&&p.prevUtr>0&&p.utr>0&&Math.abs(p.utr-p.prevUtr)>0.01){
        const diff=(p.utr-p.prevUtr).toFixed(2);
        utrChange=diff>0?\`<span class="utr-change up">▲+\${diff}</span>\`:\`<span class="utr-change down">▼\${diff}</span>\`;
      }
      html+=\`<div class="player-row \${isTop?'top3':''}">
        <div class="rank-badge \${isTop?'top':'normal'}">\${badge}</div>
        <div class="player-info"><div class="player-name">\${p.name}</div><div class="player-age">Age \${p.age}</div></div>
        <div class="level-col"><span class="level-badge badge-\${level}">\${level}</span></div>
        <div class="utr-dual">
          <div class="utr-row"><span class="utr-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="#1F4E79"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></span><span class="utr-val \${p.utr>0?'':'zero'}">\${p.utr>0?p.utr.toFixed(2):'—'}</span>\${utrChange}</div>
          <div class="utr-row"><span class="utr-icon"><svg width="16" height="13" viewBox="0 0 32 24" fill="#1F4E79"><path d="M8 12c2.2 0 4-1.8 4-4S10.2 4 8 4 4 5.8 4 8s1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm16-2c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg></span><span class="utr-val-d \${p.utrd>0?'':'zero'}">\${p.utrd>0?p.utrd.toFixed(2):'—'}</span></div>
        </div>
        <div class="bar-dual">
          <div class="bar-bg"><div class="bar-fill-s" style="width:\${pctS}%"></div></div>
          <div class="bar-bg"><div class="bar-fill-d" style="width:\${pctD}%"></div></div>
        </div>
      </div>\`;
    });
  });
  document.getElementById('table-body').innerHTML=html;
}

const data=JSON.parse(document.getElementById('player-data').textContent);
render(data);
function shareLink(){const url='https://matchpoint-rankings-production.up.railway.app';if(navigator.share){navigator.share({title:'Matchpoint Junior Rankings',url:url});}else{navigator.clipboard.writeText(url).then(()=>{const t=document.getElementById('copiedToast');t.style.display='block';setTimeout(()=>t.style.display='none',2000);});}}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}
<\/script>
</body>
</html>`;

  const blob=new Blob([publicHtml],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('🚀 Published!');
}

initMonthlyBase();
render();
</script>
